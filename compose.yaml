name: termin
x-php: &php
  image: termin-api:local
  build:
    context: .
    dockerfile: docker/php.Dockerfile
  env_file: .env
  volumes:
    - app-storage:/var/www/html/storage
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
  migrate:
    <<: *php
    user: www-data
    command: ["php","artisan","migrate","--force"]
    depends_on:
      db:
        condition: service_healthy
  app:
    <<: *php
    depends_on:
      migrate:
        condition: service_completed_successfully
  scheduler:
    <<: *php
    user: www-data
    command: ["php","artisan","schedule:work"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_GOOGLE_MAPS_KEY: ${VITE_GOOGLE_MAPS_KEY:-}
        VITE_IOS_DOWNLOAD_URL: ${VITE_IOS_DOWNLOAD_URL:-}
        VITE_ANDROID_DOWNLOAD_URL: ${VITE_ANDROID_DOWNLOAD_URL:-}
        VITE_PUBLIC_SITE_URL: ${APP_URL}
    volumes:
      - ./downloads:/usr/share/nginx/html/downloads:ro
    depends_on: [app]
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
  mailpit:
    image: axllent/mailpit:v1.26
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
volumes:
  mysql-data:
  app-storage:
